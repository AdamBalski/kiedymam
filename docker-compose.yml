services:
  umb-syncer:
    image: ghcr.io/adambalski/kiedymam:${UMB_SYNCER_VERSION:-latest}
    build: .
    restart: unless-stopped
    network_mode: host
    pids_limit: 128
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      HOST: 127.0.0.1
      PORT: 8080
      DATABASE_PATH: /data/umb-syncer.sqlite3
      METRICS_DATABASE_PATH: /data/metrics.sqlite3
      APP_VERSION: ${UMB_SYNCER_VERSION:-unknown}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      APP_ORIGIN: ${APP_ORIGIN:?Set APP_ORIGIN to the public HTTPS origin}
      APP_BASE_PATH: ${APP_BASE_PATH:-}
      GOOGLE_OAUTH_CLIENT_JSON: ${GOOGLE_OAUTH_CLIENT_JSON:?Set GOOGLE_OAUTH_CLIENT_JSON}
      OCI_SECRET_OCID: ${OCI_SECRET_OCID:?Set OCI_SECRET_OCID}
      OCI_WEB_PUSH_VAPID_SECRET_OCID: ${OCI_WEB_PUSH_VAPID_SECRET_OCID:-}
      WEB_PUSH_VAPID_SUBJECT: ${WEB_PUSH_VAPID_SUBJECT:-https://change.me}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      - umb-syncer-data:/data
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - |
          import os
          from urllib.request import urlopen
          urlopen(f"http://127.0.0.1:{os.environ.get('PORT', '8080')}/api/health", timeout=3)
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

volumes:
  umb-syncer-data:
