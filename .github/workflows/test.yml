name: Test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  system-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system test dependencies
        run: python -m pip install -r backend/requirements-system-test.txt

      - name: Run repository and live workbook system tests
        run: PYTHONPATH=backend python -m unittest discover -s tests -v

      - name: Build the container image
        run: docker build -t umb-syncer:ci .
